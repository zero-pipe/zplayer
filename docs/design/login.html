<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZeroPlayer · 登录</title>
<link rel="stylesheet" href="design.css">
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()" title="切换主题">
  <svg class="i" id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>

<div class="login-root">
  <div class="login-card">
    <!-- ============ 品牌区：智能物联引擎 logo ============ -->
    <aside class="brand">
      <div class="brand-grid"></div>
      <div class="brand-hero">
        <!-- 六边形主体 + 中心传感眼 + 环绕物联节点：表达「智能物联引擎」 -->
        <svg viewBox="0 0 200 200" fill="none">
          <defs>
            <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#1976D2"/><stop offset="1" stop-color="#1E88E5"/>
            </linearGradient>
            <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#1565C0"/><stop offset="1" stop-color="#0D47A1"/>
            </linearGradient>
            <linearGradient id="gcore" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#42A5F5"/><stop offset="1" stop-color="#1565C0"/>
            </linearGradient>
          </defs>
          <!-- 外环网线 -->
          <g stroke="#1565C0" stroke-opacity=".28" stroke-width="1.5">
            <path d="M100 22 L168 60 L168 140 L100 178 L32 140 L32 60 Z" fill="url(#g2)" fill-opacity=".06"/>
          </g>
          <!-- 环绕节点连线 -->
          <g stroke="#1565C0" stroke-opacity=".35" stroke-width="1.4">
            <path d="M100 100 L100 30"/><path d="M100 100 L162 66"/><path d="M100 100 L162 138"/>
            <path d="M100 100 L100 172"/><path d="M100 100 L38 138"/><path d="M100 100 L38 66"/>
          </g>
          <!-- 六边形立体主体 -->
          <path d="M100 46 L150 74 L150 128 L100 156 L50 128 L50 74 Z" fill="url(#g1)"/>
          <path d="M100 46 L150 74 L150 128 L100 156 L50 128 L50 74 Z" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/>
          <!-- 中心传感眼（光圈） -->
          <circle cx="100" cy="98" r="24" fill="#fff" fill-opacity=".95"/>
          <circle cx="100" cy="98" r="24" fill="none" stroke="url(#gcore)" stroke-width="3"/>
          <circle cx="100" cy="98" r="12" fill="url(#gcore)"/>
          <circle cx="95" cy="93" r="4" fill="#fff" fill-opacity=".8"/>
          <!-- 物联节点 -->
          <g>
            <circle cx="100" cy="30" r="6" fill="#1565C0"/><circle cx="100" cy="30" r="2.6" fill="#fff"/>
            <circle cx="162" cy="66" r="6" fill="#1E88E5"/><circle cx="162" cy="66" r="2.6" fill="#fff"/>
            <circle cx="162" cy="138" r="6" fill="#26A69A"/><circle cx="162" cy="138" r="2.6" fill="#fff"/>
            <circle cx="100" cy="172" r="6" fill="#1565C0"/><circle cx="100" cy="172" r="2.6" fill="#fff"/>
            <circle cx="38" cy="138" r="6" fill="#1E88E5"/><circle cx="38" cy="138" r="2.6" fill="#fff"/>
            <circle cx="38" cy="66" r="6" fill="#26A69A"/><circle cx="38" cy="66" r="2.6" fill="#fff"/>
          </g>
        </svg>
      </div>
      <div class="brand-name"><b>Zero</b>Engine</div>
      <div class="brand-sub">智能物联 · 视觉引擎</div>
      <div class="brand-foot">Intelligent IoT Vision Engine</div>
    </aside>

    <!-- ============ 表单区：图标化极简 ============ -->
    <section class="form">
      <button class="form-close" onclick="showServer(true)">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>

      <h1>欢迎回来</h1>
      <p class="sub">登录以接入您的物联视觉平台</p>

      <div class="ifield">
        <span class="lead">
          <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
        </span>
        <input value="admin" placeholder="用户名" spellcheck="false">
      </div>

      <div class="ifield">
        <span class="lead">
          <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        </span>
        <input type="password" value="123456" placeholder="密码" spellcheck="false">
        <span class="tail" title="显示密码">
          <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </span>
      </div>

      <div class="form-opts">
        <label class="check on"><span class="box"></span>记住登录</label>
        <button class="server-cfg" onclick="showServer(true)">
          <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
          <span class="st"></span>服务器设置
        </button>
      </div>

      <button class="btn-primary">登 录</button>
      <div class="form-err"></div>
    </section>
  </div>
</div>

<!-- 服务器设置弹层（保存到本地，不暴露在主页） -->
<div class="sheet-mask" id="serverMask">
  <div class="sheet">
    <h3>
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg>
      服务器设置
    </h3>
    <p class="desc">配置将保存在本机，下次登录自动使用</p>
    <div class="field">
      <label>平台地址</label>
      <input value="http://127.0.0.1:18080" spellcheck="false">
    </div>
    <div class="field">
      <label>备注名称（可选）</label>
      <input placeholder="例如：总部平台" spellcheck="false">
    </div>
    <div class="sheet-actions">
      <button class="ghost" onclick="showServer(false)">取消</button>
      <button class="ok" onclick="showServer(false)">保存</button>
    </div>
  </div>
</div>

<script src="theme.js"></script>
<script>
  function showServer(show) {
    document.getElementById("serverMask").classList.toggle("show", show);
  }
</script>
</body>
</html>
